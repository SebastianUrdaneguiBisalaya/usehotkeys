name: Publish to npm

on:
  push:
    branches: [main]

# Never cancel a publish that is already running; queue the next one instead.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish packages whose version is not on npm yet
        run: |
          for dir in packages/core packages/react; do
            PKG_NAME=$(node -p "require('./$dir/package.json').name")
            PKG_VERSION=$(node -p "require('./$dir/package.json').version")
            # Query the registry from outside the repo: inside it, npm refuses to run because
            # devEngines.packageManager asks for pnpm, and the check would always look "unpublished".
            if (cd "$RUNNER_TEMP" && npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1); then
              echo "$PKG_NAME@$PKG_VERSION is already published, skipping."
            else
              (cd "$dir" && pnpm publish --access public --no-git-checks --provenance)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
